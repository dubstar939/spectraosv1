<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soundboard — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    .window { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .titlebar { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); }
    .title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .winbtns { display: flex; gap: 6px; }
    .winbtn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; background: #ff5f57; }
    .winbody { flex: 1; padding: 10px; display: flex; flex-direction: column; overflow: auto; }
    .sb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:15px;}
    .sb-pad{padding:20px;border-radius:12px;background:rgba(255,255,255,.05);text-align:center;cursor:pointer;transition:all .15s;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;}
    .sb-pad:hover{background:rgba(255,255,255,.1);transform:translateY(-2px);border-color:rgba(0,255,136,.2);}
    .sb-pad:active{transform:scale(0.95);}
    .sb-pad.playing{box-shadow:0 0 20px rgba(0,255,136,.3);border-color:#00ff88;}
    .sb-pad-icon{font-size:24px;margin-bottom:8px;}
    .sb-pad-name{font-size:12px;}
    .sb-pad-key{font-size:10px;opacity:.4;margin-top:4px;}
    .sb-visualizer{display:flex;align-items:flex-end;justify-content:center;height:40px;gap:2px;margin:10px 15px;}
    .sb-vbar{width:4px;background:#00ff88;border-radius:2px;transition:height .1s;min-height:2px;}
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar"><div class="title">🔊 Soundboard</div><div class="winbtns"><button class="winbtn" onclick="window.parent.postMessage({type:'closeWindow'},'*')">×</button></div></div>
    <div class="winbody">
      <div class="sb-visualizer" id="sbVis"></div>
      <div class="sb-grid" id="sbGrid"></div>
    </div>
  </div>
  <script>
    // Audio context for synthesizing instrument sounds
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    
    // Preload sounds on init
    const sounds = [
      {n:'Kick', i:'🥁', type:'kick', f:60, d:0.2},
      {n:'Snare', i:'🪘', type:'noise', f:200, d:0.15},
      {n:'Hi-Hat', i:'🎩', type:'noise', f:800, d:0.08, hp:true},
      {n:'Clap', i:'👏', type:'noise', f:400, d:0.15},
      {n:'Bass', i:'🎸', type:'sawtooth', f:80, d:0.3},
      {n:'Lead', i:'🎹', type:'square', f:440, d:0.2},
      {n:'Pluck', i:'🎻', type:'triangle', f:330, d:0.15},
      {n:'FX', i:'✨', type:'sine', f:600, d:0.25, slide:true},
      {n:'Laser', i:'⚡', type:'sawtooth', f:880, d:0.15, slideDown:true},
      {n:'Coin', i:'🪙', type:'sine', f:987, d:0.1},
      {n:'Jump', i:'🦘', type:'sine', f:523, d:0.15, slideUp:true},
      {n:'Power', i:'💥', type:'square', f:220, d:0.3}
    ];
    
    function playSound(sound) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      const now = ctx.currentTime;
      
      switch(sound.type) {
        case 'kick':
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(0.01, now + sound.d);
          gain.gain.setValueAtTime(1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + sound.d);
          break;
        case 'noise':
          // Create noise buffer
          const bufferSize = ctx.sampleRate * sound.d;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for(let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          noise.connect(gain);
          
          if(sound.hp) {
            const filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = sound.f;
            noise.disconnect();
            noise.connect(filter);
            filter.connect(gain);
          } else {
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + sound.d);
          }
          noise.start(now);
          noise.stop(now + sound.d);
          animateVis();
          return;
        case 'sawtooth':
          osc.type = 'sawtooth';
          break;
        case 'square':
          osc.type = 'square';
          break;
        case 'triangle':
          osc.type = 'triangle';
          break;
        default:
          osc.type = 'sine';
      }
      
      if(sound.slide) {
        osc.frequency.setValueAtTime(sound.f, now);
        osc.frequency.linearRampToValueAtTime(sound.f * 2, now + sound.d);
      } else if(sound.slideDown) {
        osc.frequency.setValueAtTime(sound.f, now);
        osc.frequency.exponentialRampToValueAtTime(sound.f * 0.1, now + sound.d);
      } else if(sound.slideUp) {
        osc.frequency.setValueAtTime(sound.f * 0.5, now);
        osc.frequency.linearRampToValueAtTime(sound.f, now + sound.d);
      } else {
        osc.frequency.setValueAtTime(sound.f, now);
      }
      
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + sound.d);
      
      osc.start(now);
      osc.stop(now + sound.d);
      animateVis();
    }
    
    function animateVis(){
      const v = document.getElementById('sbVis');
      v.innerHTML = '';
      for(let i = 0; i < 30; i++){
        const b = document.createElement('div');
        b.className = 'sb-vbar';
        b.style.height = (Math.random() * 35 + 5) + 'px';
        v.appendChild(b);
      }
      setTimeout(() => v.innerHTML = '', 300);
    }
    
    function initGrid(){
      const g = document.getElementById('sbGrid');
      sounds.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'sb-pad';
        el.innerHTML = '<div class="sb-pad-icon">'+s.i+'</div><div class="sb-pad-name">'+s.n+'</div><div class="sb-pad-key">'+(i+1)+'</div>';
        el.onclick = () => {
          el.classList.add('playing');
          setTimeout(() => el.classList.remove('playing'), 200);
          playSound(s);
        };
        g.appendChild(el);
      });
    }
    
    document.addEventListener('keydown', e => {
      const n = parseInt(e.key);
      if(n >= 1 && n <= sounds.length){
        const pads = document.querySelectorAll('.sb-pad');
        pads[n-1].click();
      }
    });
    
    // Resume audio context on first user interaction
    document.body.addEventListener('click', () => {
      if(ctx.state === 'suspended') ctx.resume();
    }, {once:true});
    
    initGrid();
  </script>
</body>
</html>
