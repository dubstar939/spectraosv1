<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clipboard — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    .cb-list{max-height:320px;overflow-y:auto;padding:10px;}
    .cb-item{padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.05);margin-bottom:6px;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center;}
    .cb-item:hover{background:rgba(255,255,255,.1);}
    .cb-text{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px;}
    .cb-time{font-size:10px;opacity:.4;}
    .cb-actions{display:flex;gap:5px;}
  </style>
</head>
<body>
  <div class="window" style="width:360px;height:420px;">
    <div class="titlebar"><div class="title">📋 Clipboard</div><div class="winbtns"><button class="winbtn" onclick="window.close()">×</button></div></div>
    <div class="winbody">
      <div style="padding:10px;display:flex;gap:8px;">
        <input type="text" class="input" id="cbInput" placeholder="Type and press Enter..." style="flex:1;" onkeypress="if(event.key==='Enter')addCB()">
        <button class="btn" onclick="addCB()">Add</button>
        <button class="btn" onclick="clearCB()">Clear All</button>
      </div>
      <div class="cb-list" id="cbList"></div>
    </div>
  </div>
  <script>
    let clips=[{t:'npm install spectra-os',time:'2 min ago'},{t:'const os = new SpectraOS();',time:'5 min ago'},{t:'git commit -m "initial"',time:'12 min ago'},{t:'https://spectra.os/apps',time:'1 hour ago'}];
    function renderCB(){
      const l=document.getElementById('cbList'); l.innerHTML='';
      clips.forEach((c,i)=>{
        const el=document.createElement('div'); el.className='cb-item';
        el.innerHTML=`<span class="cb-text">${c.t}</span><span class="cb-time">${c.time}</span><div class="cb-actions"><button class="btn" style="padding:4px 8px;font-size:11px;" onclick="copyCB(${i})">Copy</button><button class="btn" style="padding:4px 8px;font-size:11px;" onclick="delCB(${i})">✕</button></div>`;
        l.appendChild(el);
      });
    }
    function addCB(){const t=document.getElementById('cbInput'); if(!t.value)return; clips.unshift({t:t.value,time:'Just now'}); t.value=''; renderCB();}
    function copyCB(i){navigator.clipboard?.writeText(clips[i].t);}
    function delCB(i){clips.splice(i,1); renderCB();}
    function clearCB(){clips=[]; renderCB();}
    renderCB();
  </script>
</body>
</html>
