<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Art Editor — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    .pa-layout{display:flex;height:calc(100% - 40px);gap:12px;}
    .pa-tools{width:50px;display:flex;flex-direction:column;gap:8px;padding:10px;}
    .pa-tool{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .2s;border:1px solid transparent;}
    .pa-tool:hover,.pa-tool.active{background:rgba(255,255,255,.15);border-color:rgba(0,255,136,.3);}
    .pa-colors{display:flex;flex-wrap:wrap;gap:4px;padding:10px;width:120px;}
    .pa-color{width:24px;height:24px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all .2s;}
    .pa-color:hover,.pa-color.active{border-color:#fff;transform:scale(1.1);}
    .pa-canvas-area{flex:1;display:flex;align-items:center;justify-content:center;}
    #paCanvas{cursor:crosshair;image-rendering:pixelated;}
    .pa-actions{display:flex;gap:8px;padding:10px;justify-content:center;}
  </style>
</head>
<body>
  <div class="window" style="width:560px;height:480px;">
    <div class="titlebar"><div class="title">🎨 Pixel Art Editor</div><div class="winbtns"><button class="winbtn" onclick="window.close()">×</button></div></div>
    <div class="winbody">
      <div class="pa-layout">
        <div class="pa-tools">
          <div class="pa-tool active" onclick="setTool('pen')" title="Pen">✏️</div>
          <div class="pa-tool" onclick="setTool('eraser')" title="Eraser">🧼</div>
          <div class="pa-tool" onclick="setTool('fill')" title="Fill">🪣</div>
          <div class="pa-tool" onclick="setTool('picker')" title="Picker">💉</div>
          <div class="pa-tool" onclick="clearCanvas()" title="Clear">🗑</div>
        </div>
        <div class="pa-colors" id="paColors"></div>
        <div class="pa-canvas-area">
          <canvas id="paCanvas" width="320" height="320"></canvas>
        </div>
      </div>
      <div class="pa-actions">
        <button class="btn" onclick="resizeGrid(8)">8×8</button>
        <button class="btn" onclick="resizeGrid(16)">16×16</button>
        <button class="btn" onclick="resizeGrid(32)">32×32</button>
        <button class="btn" onclick="resizeGrid(64)">64×64</button>
        <button class="btn" onclick="downloadArt()">💾 Download</button>
      </div>
    </div>
  </div>
  <script>
    const c=document.getElementById('paCanvas'),ctx=c.getContext('2d');
    const colors=['#000000','#ffffff','#ff0055','#00ff88','#00ccff','#ffcc00','#cc00ff','#ff6600','#333333','#666666','#999999','#cccccc'];
    let gridSize=16,cellSize=20,pixels={},tool='pen',currentColor=colors[3],drawing=false;
    function initColors(){const p=document.getElementById('paColors');p.innerHTML='';colors.forEach((col,i)=>{const d=document.createElement('div');d.className='pa-color'+(i===3?' active':'');d.style.background=col;d.onclick=()=>{currentColor=col;document.querySelectorAll('.pa-color').forEach(x=>x.classList.remove('active'));d.classList.add('active');};p.appendChild(d);});}
    function resizeGrid(n){gridSize=n;cellSize=Math.floor(320/gridSize);pixels={};drawGrid();}
    function drawGrid(){ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,320,320);for(let y=0;y<gridSize;y++)for(let x=0;x<gridSize;x++){const key=x+','+y;if(pixels[key]){ctx.fillStyle=pixels[key];ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize);}}for(let i=0;i<=gridSize;i++){ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(i*cellSize,0);ctx.lineTo(i*cellSize,320);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cellSize);ctx.lineTo(320,i*cellSize);ctx.stroke();}}
    function setTool(t){tool=t;document.querySelectorAll('.pa-tool').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');}
    function clearCanvas(){pixels={};drawGrid();}
    function getCell(e){const r=c.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/cellSize);const y=Math.floor((e.clientY-r.top)/cellSize);return{x,y};}
    function paint(e){const{x,y}=getCell(e);if(x<0||x>=gridSize||y<0||y>=gridSize)return;const key=x+','+y;if(tool==='pen')pixels[key]=currentColor;else if(tool==='eraser')delete pixels[key];else if(tool==='fill'){const target=pixels[key];const stack=[[x,y]];while(stack.length){const[cx,cy]=stack.pop();const k=cx+','+cy;if(cx<0||cx>=gridSize||cy<0||cy>=gridSize)continue;if(pixels[k]!==target)continue;if(tool==='fill')pixels[k]=currentColor;stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);}}drawGrid();}
    c.addEventListener('mousedown',e=>{drawing=true;paint(e);});
    c.addEventListener('mousemove',e=>{if(drawing)paint(e);});
    c.addEventListener('mouseup',()=>drawing=false);
    c.addEventListener('mouseleave',()=>drawing=false);
    function downloadArt(){const link=document.createElement('a');link.download='pixel-art.png';link.href=c.toDataURL();link.click();}
    initColors();resizeGrid(16);
  </script>
</body>
</html>
