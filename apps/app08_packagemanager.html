<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Package Manager — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    .window { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .titlebar { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); }
    .title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .winbtns { display: flex; gap: 6px; }
    .winbtn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; background: #ff5f57; }
    .winbody { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow: auto; }
    .pkg-search{display:flex;gap:8px;margin-bottom:15px;}
    .pkg-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
    .pkg-item{display:flex;align-items:center;padding:12px;border-radius:8px;background:rgba(255,255,255,.05);transition:all .2s;}
    .pkg-item:hover{background:rgba(255,255,255,.1);}
    .pkg-icon{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:12px;}
    .pkg-info{flex:1;}
    .pkg-name{font-size:14px;font-weight:600;}
    .pkg-desc{font-size:12px;opacity:.5;margin-top:2px;}
    .pkg-actions{display:flex;align-items:center;gap:8px;}
    .pkg-status{padding:4px 8px;border-radius:6px;font-size:11px;background:rgba(0,255,136,.15);color:#00ff88;}
    .pkg-status.installed{background:rgba(255,255,255,.1);color:#888;}
    .pkg-terminal{background:#0a0a0f;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;height:100px;overflow-y:auto;margin-top:15px;color:#00ff88;}
    .pkg-terminal .line{margin:4px 0;}
    .pkg-terminal .error{color:#ff5f57;}
    .pkg-terminal .success{color:#00ff88;}
    .action-btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;transition:all .2s;}
    .action-btn.install{background:#00ff88;color:#000;}
    .action-btn.install:hover{background:#00cc6a;}
    .action-btn.remove{background:rgba(255,95,87,.2);color:#ff5f57;}
    .action-btn.remove:hover{background:rgba(255,95,87,.3);}
    .update-btn{padding:6px 14px;border-radius:6px;border:none;background:rgba(0,255,136,.2);color:#00ff88;cursor:pointer;font-size:12px;}
    .update-btn:hover{background:rgba(0,255,136,.3);}
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar"><div class="title">📦 Package Manager</div><div class="winbtns"><button class="winbtn" onclick="window.parent.postMessage({type:'closeWindow'},'*')">×</button></div></div>
    <div class="winbody">
      <div class="pkg-search">
        <input type="text" class="input" id="pkgSearch" placeholder="Search packages..." style="flex:1;" oninput="filterPkg()">
        <button class="update-btn" onclick="updatePkg()">🔄 Update</button>
      </div>
      <div class="pkg-list" id="pkgList"></div>
      <div class="pkg-terminal" id="pkgTerm"><div class="line">$ spectra-pkg ready</div></div>
    </div>
  </div>
  <script>
    const STORAGE_KEY = 'spectraos-packages';
    
    const defaultPackages = [
      {n:'spectra-core',d:'Core system libraries',v:'1.0.0',i:true,icon:'◉'},
      {n:'spectra-wm',d:'Window manager',v:'1.2.0',i:true,icon:'🪟'},
      {n:'spectra-gtk',d:'GTK theme engine',v:'3.24.0',i:false,icon:'🎨'},
      {n:'spectra-terminal',d:'Terminal emulator',v:'2.1.0',i:true,icon:'🖥'},
      {n:'spectra-editor',d:'Text editor',v:'1.5.0',i:false,icon:'📝'},
      {n:'spectra-media',d:'Media codecs',v:'1.0.0',i:false,icon:'🎵'},
      {n:'spectra-net',d:'Network tools',v:'2.0.0',i:true,icon:'🌐'},
      {n:'spectra-dev',d:'Developer tools',v:'1.3.0',i:false,icon:'💻'},
      {n:'spectra-games',d:'Game engine',v:'0.9.0',i:false,icon:'🎮'},
      {n:'spectra-security',d:'Security suite',v:'1.1.0',i:true,icon:'🔐'},
      {n:'spectra-cloud',d:'Cloud sync service',v:'2.0.1',i:false,icon:'☁️'},
      {n:'spectra-backup',d:'Backup utility',v:'1.0.5',i:false,icon:'💾'}
    ];
    
    let packages = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(!packages) {
      packages = JSON.parse(JSON.stringify(defaultPackages));
      savePackages();
    }
    
    function savePackages() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(packages));
    }
    
    function log(msg, type='') {
      const t = document.getElementById('pkgTerm');
      const line = document.createElement('div');
      line.className = 'line ' + type;
      line.textContent = '$ ' + msg;
      t.appendChild(line);
      t.scrollTop = t.scrollHeight;
    }
    
    function renderPkg(){
      const l = document.getElementById('pkgList');
      const q = document.getElementById('pkgSearch').value.toLowerCase();
      l.innerHTML = '';
      
      const filtered = packages.filter(p => 
        p.n.toLowerCase().includes(q) || p.d.toLowerCase().includes(q)
      );
      
      if(filtered.length === 0) {
        l.innerHTML = '<div style="opacity:.5;text-align:center;padding:20px;">No packages found</div>';
        return;
      }
      
      filtered.forEach(p => {
        const el = document.createElement('div');
        el.className = 'pkg-item';
        el.innerHTML = `
          <div class="pkg-icon">${p.icon}</div>
          <div class="pkg-info">
            <div class="pkg-name">${p.n}</div>
            <div class="pkg-desc">${p.d}</div>
          </div>
          <div class="pkg-actions">
            <span class="pkg-status ${p.i ? 'installed' : ''}">${p.i ? 'Installed' : 'v'+p.v}</span>
            <button class="action-btn ${p.i ? 'remove' : 'install'}" onclick="togglePkg('${p.n}')">${p.i ? 'Remove' : 'Install'}</button>
          </div>
        `;
        l.appendChild(el);
      });
    }
    
    function togglePkg(name) {
      const p = packages.find(x => x.n === name);
      if(!p) return;
      
      const t = document.getElementById('pkgTerm');
      
      if(p.i) {
        // Remove
        log('Removing ' + name + '...');
        setTimeout(() => {
          p.i = false;
          savePackages();
          renderPkg();
          log(name + ' removed successfully', 'success');
        }, 500);
      } else {
        // Install
        log('Installing ' + name + ' v' + p.v + '...');
        setTimeout(() => {
          p.i = true;
          savePackages();
          renderPkg();
          log(name + ' installed successfully', 'success');
        }, 800);
      }
    }
    
    function updatePkg() {
      log('Updating package list...');
      setTimeout(() => {
        log('All packages up to date', 'success');
      }, 600);
    }
    
    function filterPkg() {
      renderPkg();
    }
    
    renderPkg();
  </script>
</body>
</html>
