<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spectra Arcade — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    .arcade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:15px;}
    .arcade-card{background:rgba(255,255,255,.05);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .3s;border:1px solid rgba(255,255,255,.1);}
    .arcade-card:hover{background:rgba(255,255,255,.1);transform:translateY(-5px);box-shadow:0 10px 30px rgba(0,0,0,.3);}
    .arcade-icon{font-size:40px;margin-bottom:10px;}
    .arcade-title{font-weight:600;margin-bottom:5px;}
    .arcade-desc{font-size:12px;opacity:.6;}
  </style>
</head>
<body>
  <div class="window" style="width:600px;height:500px;">
    <div class="titlebar"><div class="title">🎮 Spectra Arcade</div><div class="winbtns"><button class="winbtn" onclick="window.close()">×</button></div></div>
    <div class="winbody">
      <div class="arcade-grid">
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app23_pong.html'},'*')"><div class="arcade-icon">🏓</div><div class="arcade-title">Pong</div><div class="arcade-desc">Classic paddle battle</div></div>
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app24_breakout.html'},'*')"><div class="arcade-icon">🧱</div><div class="arcade-title">Breakout</div><div class="arcade-desc">Brick breaker</div></div>
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app25_snake.html'},'*')"><div class="arcade-icon">🐍</div><div class="arcade-title">Snake</div><div class="arcade-desc">Eat and grow</div></div>
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app22_tetris.html'},'*')"><div class="arcade-icon">🧩</div><div class="arcade-title">Tetris</div><div class="arcade-desc">Block puzzle</div></div>
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app26_match3.html'},'*')"><div class="arcade-icon">💎</div><div class="arcade-title">Match-3</div><div class="arcade-desc">Gem matching</div></div>
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app27_minesweeper.html'},'*')"><div class="arcade-icon">💣</div><div class="arcade-title">Minesweeper</div><div class="arcade-desc">Find the mines</div></div>
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app28_platformer.html'},'*')"><div class="arcade-icon">🏃</div><div class="arcade-title">Pixel Platformer</div><div class="arcade-desc">Jump and run</div></div>
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app29_slidingtiles.html'},'*')"><div class="arcade-icon">🧮</div><div class="arcade-title">Sliding Tiles</div><div class="arcade-desc">Number puzzle</div></div>
        <div class="arcade-card" onclick="window.parent.postMessage({type:'launchApp',app:'app35_particles.html'},'*')"><div class="arcade-icon">✨</div><div class="arcade-title">Particle Sim</div><div class="arcade-desc">Physics sandbox</div></div>
      </div>
    </div>
  </div>
</body>
</html>
