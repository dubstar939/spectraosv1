<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Palette — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    .cp-layout{display:flex;height:calc(100% - 40px);gap:15px;}
    .cp-sidebar{width:180px;padding:10px;}
    .cp-main{flex:1;padding:10px;overflow-y:auto;}
    .cp-palette{display:flex;gap:0;margin-bottom:20px;border-radius:12px;overflow:hidden;height:80px;}
    .cp-color{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative;}
    .cp-color:hover{flex:1.5;}
    .cp-color-hex{font-size:11px;font-family:monospace;opacity:0;transition:opacity .2s;}
    .cp-color:hover .cp-color-hex{opacity:1;}
    .cp-color-name{font-size:10px;opacity:.6;}
    .cp-actions{display:flex;gap:8px;margin-bottom:15px;}
    .cp-harmonies{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    .cp-harmony{padding:10px;background:rgba(255,255,255,.05);border-radius:8px;cursor:pointer;transition:all .2s;}
    .cp-harmony:hover{background:rgba(255,255,255,.1);}
    .cp-harmony-title{font-size:11px;opacity:.5;margin-bottom:6px;}
    .cp-harmony-colors{display:flex;gap:4px;}
    .cp-harmony-color{flex:1;height:30px;border-radius:4px;}
  </style>
</head>
<body>
  <div class="window" style="width:560px;height:480px;">
    <div class="titlebar"><div class="title">🎨 Color Palette</div><div class="winbtns"><button class="winbtn" onclick="window.close()">×</button></div></div>
    <div class="winbody">
      <div class="cp-actions">
        <button class="btn" onclick="generatePalette()">🎲 Generate</button>
        <button class="btn" onclick="copyPalette()">📋 Copy</button>
        <button class="btn" onclick="exportPalette()">💾 Export</button>
      </div>
      <div class="cp-palette" id="cpPalette"></div>
      <div class="cp-layout">
        <div class="cp-sidebar">
          <div style="font-size:11px;opacity:.5;margin-bottom:8px;">Base Color</div>
          <input type="color" class="input" id="cpBase" value="#00ff88" style="width:100%;height:40px;padding:0;border:none;margin-bottom:15px;">
          <div style="font-size:11px;opacity:.5;margin-bottom:8px;">Harmony</div>
          <select class="input" id="cpHarmony" style="width:100%;margin-bottom:15px;">
            <option value="analogous">Analogous</option>
            <option value="complementary">Complementary</option>
            <option value="triadic">Triadic</option>
            <option value="split">Split-Comp</option>
            <option value="tetradic">Tetradic</option>
            <option value="monochromatic">Mono</option>
          </select>
          <div style="font-size:11px;opacity:.5;margin-bottom:8px;">Shades</div>
          <div id="cpShades"></div>
        </div>
        <div class="cp-main">
          <div style="font-size:11px;opacity:.5;margin-bottom:8px;">Saved Palettes</div>
          <div class="cp-harmonies" id="cpSaved"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    let currentPalette=[];
    function hsvToHex(h,s,v){const c=v*s;const x=c*(1-Math.abs((h/60)%2-1));const m=v-c;let r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}const toHex=n=>Math.round((n+m)*255).toString(16).padStart(2,'0');return'#'+toHex(r)+toHex(g)+toHex(b);}
    function generatePalette(){
      const base=document.getElementById('cpBase').value;const harmony=document.getElementById('cpHarmony').value;
      const r=parseInt(base.slice(1,3),16)/255,g=parseInt(base.slice(3,5),16)/255,b=parseInt(base.slice(5,7),16)/255;
      const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0;if(max!==min){if(max===r)h=(g-b)/(max-min);else if(max===g)h=2+(b-r)/(max-min);else h=4+(r-g)/(max-min);h*=60;if(h<0)h+=360;}const s=max===0?0:(max-min)/max;const v=max;
      let hues=[];
      switch(harmony){case'analogous':hues=[h-30,h,h+30];break;case'complementary':hues=[h,h+180];break;case'triadic':hues=[h,h+120,h+240];break;case'split':hues=[h,h+150,h+210];break;case'tetradic':hues=[h,h+90,h+180,h+270];break;case'monochromatic':hues=[h,h,h,h,h];break;}
      currentPalette=hues.map((hue,i)=>{if(harmony==='monochromatic')return hsvToHex(h,s,Math.max(.2,Math.min(1,v+(i-2)*.2)));return hsvToHex((hue+360)%360,s,v);});
      renderPalette();renderShades();savePalette();
    }
    function renderPalette(){const p=document.getElementById('cpPalette');p.innerHTML='';currentPalette.forEach((color,i)=>{const el=document.createElement('div');el.className='cp-color';el.style.background=color;el.innerHTML='<div class="cp-color-hex">'+color+'</div>';el.onclick=()=>{navigator.clipboard.writeText(color);};p.appendChild(el);});}
    function renderShades(){const s=document.getElementById('cpShades');s.innerHTML='';if(!currentPalette.length)return;const base=currentPalette[0];const r=parseInt(base.slice(1,3),16),g=parseInt(base.slice(3,5),16),b=parseInt(base.slice(5,7),16);for(let i=0;i<5;i++){const factor=.2+i*.2;const nr=Math.round(r*factor).toString(16).padStart(2,'0');const ng=Math.round(g*factor).toString(16).padStart(2,'0');const nb=Math.round(b*factor).toString(16).padStart(2,'0');const el=document.createElement('div');el.style.width='100%';el.style.height='24px';el.style.background='#'+nr+ng+nb;el.style.borderRadius='4px';el.style.marginBottom='4px';el.style.cursor='pointer';el.onclick=()=>navigator.clipboard.writeText('#'+nr+ng+nb);s.appendChild(el);}}
    let saved=[];
    function savePalette(){if(currentPalette.length){saved.unshift([...currentPalette]);if(saved.length>6)saved.pop();renderSaved();}}
    function renderSaved(){const s=document.getElementById('cpSaved');s.innerHTML='';saved.forEach((pal,i)=>{const el=document.createElement('div');el.className='cp-harmony';el.innerHTML='<div class="cp-harmony-title">Palette '+(i+1)+'</div><div class="cp-harmony-colors">'+pal.map(c=>'<div class="cp-harmony-color" style="background:'+c+'"></div>').join('')+'</div>';el.onclick=()=>{currentPalette=[...pal];renderPalette();renderShades();};s.appendChild(el);});}
    function copyPalette(){navigator.clipboard.writeText(currentPalette.join(', '));}
    function exportPalette(){const data=JSON.stringify(currentPalette,null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='palette.json';a.click();}
    generatePalette();
  </script>
</body>
</html>
