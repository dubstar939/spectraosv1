<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Tester — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    .api-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
    .api-method{padding:6px 10px;border-radius:6px;border:none;background:rgba(0,255,136,.2);color:#00ff88;font-size:12px;cursor:pointer;}
    .api-url{flex:1;}
    .api-tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px;}
    .api-tab{padding:8px 16px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
    .api-tab:hover,.api-tab.active{border-bottom-color:#00ff88;color:#00ff88;}
    .api-panel{display:none;}
    .api-panel.active{display:block;}
    .api-textarea{width:100%;height:120px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px;color:#e0e0e0;font-family:monospace;font-size:12px;resize:none;outline:none;}
    .api-response{background:rgba(0,0,0,.3);border-radius:8px;padding:12px;font-family:monospace;font-size:12px;min-height:100px;overflow:auto;white-space:pre-wrap;}
  </style>
</head>
<body>
  <div class="window" style="width:600px;height:480px;">
    <div class="titlebar"><div class="title">🔌 API Tester</div><div class="winbtns"><button class="winbtn" onclick="window.close()">×</button></div></div>
    <div class="winbody">
      <div class="api-row">
        <select class="input api-method" id="apiMethod" style="width:80px;"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option></select>
        <input type="text" class="input api-url" id="apiUrl" value="https://api.github.com/users/github" placeholder="Enter URL...">
        <button class="btn" onclick="sendRequest()">Send</button>
      </div>
      <div class="api-tabs">
        <div class="api-tab active" onclick="switchTab('params')">Params</div>
        <div class="api-tab" onclick="switchTab('headers')">Headers</div>
        <div class="api-tab" onclick="switchTab('body')">Body</div>
        <div class="api-tab" onclick="switchTab('auth')">Auth</div>
      </div>
      <div class="api-panel active" id="panel-params"><textarea class="api-textarea" placeholder="key=value
key2=value2"></textarea></div>
      <div class="api-panel" id="panel-headers"><textarea class="api-textarea" placeholder="Content-Type: application/json
Authorization: Bearer token"></textarea></div>
      <div class="api-panel" id="panel-body"><textarea class="api-textarea" placeholder='{"key": "value"}'></textarea></div>
      <div class="api-panel" id="panel-auth"><textarea class="api-textarea" placeholder="Bearer token or API key"></textarea></div>
      <div style="margin-top:10px;"><div style="font-size:11px;opacity:.5;margin-bottom:5px;">Response</div><div class="api-response" id="apiResponse">// Click Send to make a request</div></div>
    </div>
  </div>
  <script>
    function switchTab(t){document.querySelectorAll('.api-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.api-panel').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');document.getElementById('panel-'+t).classList.add('active');}
    async function sendRequest(){
      const url=document.getElementById('apiUrl').value,method=document.getElementById('apiMethod').value,resp=document.getElementById('apiResponse');
      resp.textContent='Loading...';
      try{
        const r=await fetch(url,{method,headers:{'Accept':'application/json'}});
        const data=await r.json().catch(()=>r.text());
        resp.textContent='Status: '+r.status+' '+r.statusText+'

'+JSON.stringify(data,null,2);
      }catch(e){resp.textContent='Error: '+e.message;}
    }
  </script>
</body>
</html>
