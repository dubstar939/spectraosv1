<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    .br-toolbar{display:flex;gap:8px;padding:8px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.1);align-items:center;}
    .br-nav{display:flex;gap:5px;}
    .br-nav button{width:28px;height:28px;border-radius:6px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:14px;}
    .br-nav button:hover{background:rgba(255,255,255,.2);}
    .br-addr{flex:1;}
    .br-addr input{width:100%;padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:#fff;font-size:13px;}
    .br-content{padding:20px;text-align:center;}
    .br-card{display:inline-block;width:120px;padding:15px;margin:8px;background:rgba(255,255,255,.05);border-radius:10px;cursor:pointer;transition:all .3s;}
    .br-card:hover{background:rgba(255,255,255,.1);transform:translateY(-3px);}
    .br-card-icon{font-size:28px;margin-bottom:8px;}
    .br-card-title{font-size:12px;}
  </style>
</head>
<body>
  <div class="window" style="width:600px;height:480px;">
    <div class="titlebar"><div class="title">🌐 Spectra Browser</div><div class="winbtns"><button class="winbtn" onclick="window.close()">×</button></div></div>
    <div class="winbody">
      <div class="br-toolbar">
        <div class="br-nav"><button onclick="goHome()">🏠</button><button>◀</button><button>▶</button><button>↻</button></div>
        <div class="br-addr"><input type="text" id="brUrl" value="spectra://newtab" onkeypress="if(event.key==='Enter')navigate()"></div>
      </div>
      <div class="br-content" id="brContent">
        <div style="font-size:48px;margin-bottom:20px;">🔍</div>
        <div style="font-size:18px;font-weight:600;margin-bottom:20px;">Spectra Search</div>
        <input type="text" class="input" placeholder="Search the web..." style="width:300px;margin-bottom:30px;">
        <div>
          <div class="br-card" onclick="window.open('https://github.com','_blank')"><div class="br-card-icon">🐙</div><div class="br-card-title">GitHub</div></div>
          <div class="br-card" onclick="window.open('https://stackoverflow.com','_blank')"><div class="br-card-icon">📚</div><div class="br-card-title">Stack Overflow</div></div>
          <div class="br-card" onclick="window.open('https://developer.mozilla.org','_blank')"><div class="br-card-icon">🦊</div><div class="br-card-title">MDN</div></div>
          <div class="br-card" onclick="window.open('https://codepen.io','_blank')"><div class="br-card-icon">🖊</div><div class="br-card-title">CodePen</div></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function goHome(){document.getElementById('brUrl').value='spectra://newtab';document.getElementById('brContent').innerHTML='<div style="font-size:48px;margin-bottom:20px;">🔍</div><div style="font-size:18px;font-weight:600;margin-bottom:20px;">Spectra Search</div><input type="text" class="input" placeholder="Search the web..." style="width:300px;margin-bottom:30px;"><div><div class="br-card" onclick="window.open('https://github.com','_blank')"><div class="br-card-icon">🐙</div><div class="br-card-title">GitHub</div></div><div class="br-card" onclick="window.open('https://stackoverflow.com','_blank')"><div class="br-card-icon">📚</div><div class="br-card-title">Stack Overflow</div></div><div class="br-card" onclick="window.open('https://developer.mozilla.org','_blank')"><div class="br-card-icon">🦊</div><div class="br-card-title">MDN</div></div><div class="br-card" onclick="window.open('https://codepen.io','_blank')"><div class="br-card-icon">🖊</div><div class="br-card-title">CodePen</div></div></div>';}
    function navigate(){const url=document.getElementById('brUrl').value;if(url.startsWith('http'))window.open(url,'_blank');}
  </script>
</body>
</html>
