<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wallpaper Designer — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    .window { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .titlebar { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); }
    .title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .winbtns { display: flex; gap: 6px; }
    .winbtn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; background: #ff5f57; }
    .winbody { flex: 1; padding: 10px; display: flex; flex-direction: column; overflow: auto; }
    #wp-canvas{display:block;margin:10px auto;border-radius:8px;max-width:100%;}
    .wp-controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;}
    .wp-control{padding:10px;background:rgba(255,255,255,.05);border-radius:8px;}
    .wp-label{font-size:11px;opacity:.6;margin-bottom:5px;display:block;}
    .wp-actions{text-align:center;margin-top:10px;display:flex;gap:10px;justify-content:center;}
    .wp-actions button{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:13px;}
    .wp-actions .apply{background:#00ff88;color:#000;}
    .wp-actions .download{background:rgba(255,255,255,.1);color:#fff;}
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar"><div class="title">🖼 Wallpaper Designer</div><div class="winbtns"><button class="winbtn" onclick="window.parent.postMessage({type:'closeWindow'},'*')">×</button></div></div>
    <div class="winbody">
      <canvas id="wp-canvas" width="400" height="225"></canvas>
      <div class="wp-controls">
        <div class="wp-control"><label class="wp-label">Pattern</label><select class="input" id="wpPattern" onchange="renderWP()"><option>Gradient</option><option>Grid</option><option>Dots</option><option>Waves</option><option>Noise</option></select></div>
        <div class="wp-control"><label class="wp-label">Primary Color</label><input type="color" class="input" id="wpColor1" value="#0a0a1f" onchange="renderWP()" style="width:100%;height:36px;"></div>
        <div class="wp-control"><label class="wp-label">Secondary Color</label><input type="color" class="input" id="wpColor2" value="#00ff88" onchange="renderWP()" style="width:100%;height:36px;"></div>
        <div class="wp-control"><label class="wp-label">Complexity</label><input type="range" class="input" id="wpComplex" min="1" max="10" value="5" oninput="renderWP()"></div>
      </div>
      <div class="wp-actions">
        <button class="apply" onclick="applyWP()">Apply as Wallpaper</button>
        <button class="download" onclick="downloadWP()">Download</button>
      </div>
    </div>
  </div>
  <script>
    const STORAGE_KEY = 'spectraos-wallpaper';
    const c = document.getElementById('wp-canvas'), ctx = c.getContext('2d');
    
    // Load saved wallpaper preference on boot
    window.addEventListener('load', () => {
      const saved = localStorage.getItem(STORAGE_KEY);
      if(saved) {
        document.getElementById('desktop-bg').style.background = `url(${saved}) center/cover`;
      }
    });
    
    function renderWP(){
      const p = document.getElementById('wpPattern').value,
            c1 = document.getElementById('wpColor1').value,
            c2 = document.getElementById('wpColor2').value,
            comp = parseInt(document.getElementById('wpComplex').value);
      
      ctx.fillStyle = c1;
      ctx.fillRect(0, 0, 400, 225);
      
      if(p === 'Gradient'){
        const g = ctx.createLinearGradient(0, 0, 400, 225);
        g.addColorStop(0, c1);
        g.addColorStop(1, c2);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 400, 225);
      }
      else if(p === 'Grid'){
        ctx.strokeStyle = c2;
        ctx.lineWidth = 1;
        for(let i = 0; i < 400; i += comp * 4){
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, 225);
          ctx.stroke();
        }
        for(let i = 0; i < 225; i += comp * 4){
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(400, i);
          ctx.stroke();
        }
      }
      else if(p === 'Dots'){
        ctx.fillStyle = c2;
        for(let x = 0; x < 400; x += comp * 6)
          for(let y = 0; y < 225; y += comp * 6){
            ctx.beginPath();
            ctx.arc(x, y, comp / 2, 0, Math.PI * 2);
            ctx.fill();
          }
      }
      else if(p === 'Waves'){
        ctx.strokeStyle = c2;
        ctx.lineWidth = 2;
        for(let y = 0; y < 225; y += comp * 3){
          ctx.beginPath();
          for(let x = 0; x < 400; x++){
            ctx.lineTo(x, y + Math.sin(x * 0.02 + y * 0.05) * comp * 3);
          }
          ctx.stroke();
        }
      }
      else if(p === 'Noise'){
        for(let i = 0; i < comp * 200; i++){
          ctx.fillStyle = Math.random() > 0.5 ? c1 : c2;
          ctx.fillRect(Math.random() * 400, Math.random() * 225, 2, 2);
        }
      }
    }
    
    function applyWP(){
      const dataUrl = c.toDataURL();
      localStorage.setItem(STORAGE_KEY, dataUrl);
      window.parent.postMessage({type:'setWallpaper',data:dataUrl}, '*');
    }
    
    function downloadWP(){
      const a = document.createElement('a');
      a.href = c.toDataURL();
      a.download = 'spectra-wallpaper.png';
      a.click();
    }
    
    renderWP();
  </script>
</body>
</html>
