<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    .cal-header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:10px;}
    .cal-day-h{text-align:center;font-size:11px;opacity:.5;padding:5px;}
    .cal-day{text-align:center;padding:8px;border-radius:6px;cursor:pointer;transition:all .2s;font-size:13px;}
    .cal-day:hover{background:rgba(255,255,255,.1);}
    .cal-day.today{background:#00ff88;color:#000;font-weight:600;}
    .cal-day.other{opacity:.3;}
    .cal-events{margin:10px 15px;padding:10px;background:rgba(255,255,255,.05);border-radius:8px;min-height:60px;}
    .cal-event{padding:4px 8px;margin:3px 0;background:rgba(0,255,136,.1);border-radius:4px;font-size:12px;}
  </style>
</head>
<body>
  <div class="window" style="width:380px;height:460px;">
    <div class="titlebar"><div class="title">📅 Calendar</div><div class="winbtns"><button class="winbtn" onclick="window.close()">×</button></div></div>
    <div class="winbody">
      <div class="cal-header">
        <button class="btn" onclick="changeMonth(-1)">◀</button>
        <span id="calMonth" style="font-weight:600;font-size:16px;"></span>
        <button class="btn" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-events" id="calEvents"><div style="opacity:.5;font-size:12px;">Select a day to see events</div></div>
    </div>
  </div>
  <script>
    let curDate=new Date(), events={};
    function renderCal(){
      const year=curDate.getFullYear(), month=curDate.getMonth();
      document.getElementById('calMonth').textContent=curDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      const firstDay=new Date(year,month,1).getDay();
      const daysInMonth=new Date(year,month+1,0).getDate();
      const prevDays=new Date(year,month,0).getDate();
      const grid=document.getElementById('calGrid'); grid.innerHTML='';
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{const el=document.createElement('div');el.className='cal-day-h';el.textContent=d;grid.appendChild(el);});
      for(let i=firstDay-1;i>=0;i--){const el=document.createElement('div');el.className='cal-day other';el.textContent=prevDays-i;grid.appendChild(el);}
      const today=new Date();
      for(let d=1;d<=daysInMonth;d++){
        const el=document.createElement('div');el.className='cal-day';
        if(d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear()) el.classList.add('today');
        el.textContent=d; el.onclick=()=>showEvents(year,month,d); grid.appendChild(el);
      }
    }
    function showEvents(y,m,d){
      const key=`${y}-${m+1}-${d}`;
      if(!events[key]) events[key]=[`Meeting at ${9+d%12}:00`,`Code review`,`Lunch break`];
      document.getElementById('calEvents').innerHTML=events[key].map(e=>`<div class="cal-event">${e}</div>`).join('');
    }
    function changeMonth(d){curDate.setMonth(curDate.getMonth()+d); renderCal();}
    renderCal();
  </script>
</body>
</html>
