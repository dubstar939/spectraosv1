<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    #snake-canvas{display:block;margin:10px auto;border-radius:8px;background:#0a0a0f;border:2px solid rgba(255,255,255,.1);}
    .snake-info{text-align:center;font-size:14px;margin:10px;}
    .snake-controls{text-align:center;font-size:12px;opacity:.7;}
  </style>
</head>
<body>
  <div class="window" style="width:360px;height:420px;">
    <div class="titlebar"><div class="title">🐍 Snake</div><div class="winbtns"><button class="winbtn" onclick="window.close()">×</button></div></div>
    <div class="winbody">
      <div class="snake-info">Score: <span id="snakeScore">0</span> | High: <span id="snakeHigh">0</span></div>
      <canvas id="snake-canvas" width="300" height="300"></canvas>
      <div class="snake-controls">Arrow keys to move • Space to pause</div>
      <div style="text-align:center;margin-top:5px;"><button class="btn" onclick="initSnake()">New Game</button></div>
    </div>
  </div>
  <script>
    const c=document.getElementById('snake-canvas'),ctx=c.getContext('2d');
    const GRID=20,SIZE=15;
    let snake=[],food={},dir={x:1,y:0},nextDir={x:1,y:0},score=0,high=localStorage.getItem('snakeHigh')||0,gameOver=false,paused=false,interval;
    function initSnake(){snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;gameOver=false;paused=false;document.getElementById('snakeScore').textContent='0';document.getElementById('snakeHigh').textContent=high;spawnFood();if(interval)clearInterval(interval);interval=setInterval(updateSnake,150);drawSnake();}
    function spawnFood(){do{food={x:Math.floor(Math.random()*SIZE),y:Math.floor(Math.random()*SIZE)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
    function drawSnake(){ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,300,300);snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#00ff88':'rgba(0,255,136,.6)';ctx.fillRect(s.x*GRID+1,s.y*GRID+1,GRID-2,GRID-2);});ctx.fillStyle='#ff0055';ctx.fillRect(food.x*GRID+1,food.y*GRID+1,GRID-2,GRID-2);}
    function updateSnake(){if(gameOver||paused)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=SIZE||head.y<0||head.y>=SIZE||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver=true;clearInterval(interval);if(score>high){high=score;localStorage.setItem('snakeHigh',high);}alert('Game Over! Score: '+score);return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;document.getElementById('snakeScore').textContent=score;spawnFood();}else{snake.pop();}drawSnake();}
    document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&dir.y!==1)nextDir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y!==-1)nextDir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x!==1)nextDir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x!==-1)nextDir={x:1,y:0};if(e.key===' ')paused=!paused;});
    initSnake();
  </script>
</body>
</html>
