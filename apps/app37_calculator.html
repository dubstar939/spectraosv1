<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    .window { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .titlebar { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); cursor: grab; user-select: none; }
    .title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .winbtns { display: flex; gap: 6px; }
    .winbtn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; background: #ff5f57; }
    .winbody { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow: auto; }
    .calc-display{background:rgba(0,0,0,.3);border-radius:8px;padding:15px;text-align:right;font-size:28px;margin-bottom:10px;min-height:60px;word-break:break-all;display:flex;align-items:center;justify-content:flex-end;}
    .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-content:center;flex:1;align-content:center;}
    .calc-btn{width:100%;aspect-ratio:1.2;border:none;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;transition:all .2s;}
    .calc-btn:hover{background:rgba(255,255,255,.2);}
    .calc-btn.op{background:rgba(0,255,136,.2);}
    .calc-btn.op:hover{background:rgba(0,255,136,.3);}
    .calc-btn.eq{background:#00ff88;color:#000;}
    .calc-btn.eq:hover{background:#00cc6a;}
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar"><div class="title">🧮 Calculator</div><div class="winbtns"><button class="winbtn" onclick="window.parent.postMessage({type:'closeWindow'},'*')">×</button></div></div>
    <div class="winbody">
      <div class="calc-display" id="calcDisp">0</div>
      <div class="calc-grid">
        <button class="calc-btn" onclick="calc('C')">C</button>
        <button class="calc-btn" onclick="calc('⌫')">⌫</button>
        <button class="calc-btn op" onclick="calc('%')">%</button>
        <button class="calc-btn op" onclick="calc('/')">÷</button>
        <button class="calc-btn" onclick="calc('7')">7</button>
        <button class="calc-btn" onclick="calc('8')">8</button>
        <button class="calc-btn" onclick="calc('9')">9</button>
        <button class="calc-btn op" onclick="calc('*')">×</button>
        <button class="calc-btn" onclick="calc('4')">4</button>
        <button class="calc-btn" onclick="calc('5')">5</button>
        <button class="calc-btn" onclick="calc('6')">6</button>
        <button class="calc-btn op" onclick="calc('-')">−</button>
        <button class="calc-btn" onclick="calc('1')">1</button>
        <button class="calc-btn" onclick="calc('2')">2</button>
        <button class="calc-btn" onclick="calc('3')">3</button>
        <button class="calc-btn op" onclick="calc('+')">+</button>
        <button class="calc-btn" onclick="calc('0')">0</button>
        <button class="calc-btn" onclick="calc('.')">.</button>
        <button class="calc-btn eq" onclick="calc('=')" style="grid-column:span 2;">=</button>
      </div>
    </div>
  </div>
  <script>
    let disp='0', op='', prev='';
    function calc(v){
      const d=document.getElementById('calcDisp');
      if(v==='C'){disp='0';op='';prev='';}
      else if(v==='⌫'){disp=disp.length>1?disp.slice(0,-1):'0';}
      else if('+-*/%'.includes(v)){prev=disp;op=v;disp='0';}
      else if(v==='='){if(op&&prev){try{disp=String(eval(prev+op+disp));}catch(e){disp='Error';}op='';prev='';}}
      else{if(disp==='0'&&v!=='.')disp=v;else if(!(v==='.'&&disp.includes('.')))disp+=v;}
      d.textContent=disp;
    }
    document.addEventListener('keydown',e=>{
      if('0123456789.+-*/%='.includes(e.key)){e.preventDefault();calc(e.key);}
      if(e.key==='Backspace'){e.preventDefault();calc('⌫');}
      if(e.key==='Escape'){e.preventDefault();calc('C');}
      if(e.key==='Enter'){e.preventDefault();calc('=');}
    });
  </script>
</body>
</html>
