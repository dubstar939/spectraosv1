<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather — SpectraOS</title>
  <link rel="stylesheet" href="spectra.css">
  <style>
    :root {
      --bg-primary: rgba(10, 10, 15, 0.95);
      --text-primary: #ffffff;
      --accent-color: #00ff88;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .weather-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px;
    }
    .weather-main { 
      text-align: center; 
      padding: 20px 10px; 
      flex-shrink: 0;
    }
    .weather-temp { 
      font-size: 56px; 
      font-weight: 300; 
      letter-spacing: -2px; 
      text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
      line-height: 1;
    }
    .weather-desc { 
      font-size: 14px; 
      opacity: 0.85; 
      margin: 6px 0 4px; 
      font-weight: 500; 
    }
    .weather-location { 
      font-size: 12px; 
      opacity: 0.6; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px;
      margin-top: 4px;
    }
    .weather-location::before { content: '📍'; font-size: 11px; }
    .weather-forecast { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 6px; 
      padding: 10px 5px; 
      border-top: 1px solid rgba(255, 255, 255, 0.08); 
      margin-top: 8px;
      flex-shrink: 0;
    }
    .weather-day { 
      text-align: center; 
      padding: 8px 4px; 
      background: rgba(255, 255, 255, 0.04); 
      border-radius: 8px; 
      transition: all 0.2s ease; 
      border: 1px solid transparent; 
    }
    .weather-day:hover { 
      background: rgba(255, 255, 255, 0.08); 
      border-color: rgba(0, 255, 136, 0.25); 
    }
    .weather-day-name { 
      font-size: 10px; 
      opacity: 0.55; 
      margin-bottom: 4px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    .weather-day-icon { 
      font-size: 18px; 
      margin: 4px 0; 
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3)); 
    }
    .weather-day-temp { 
      font-size: 13px; 
      font-weight: 600; 
      opacity: 0.95; 
    }
    .weather-error { 
      text-align: center; 
      padding: 15px; 
      opacity: 0.7; 
      font-size: 12px; 
    }
    .weather-loading { 
      text-align: center; 
      padding: 30px 10px; 
    }
    .weather-spinner { 
      width: 20px; 
      height: 20px; 
      border: 2px solid rgba(255, 255, 255, 0.15); 
      border-top-color: var(--accent-color); 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
      margin: 0 auto 10px; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .weather-controls { 
      display: flex; 
      gap: 6px; 
      justify-content: center; 
      align-items: center; 
      padding: 8px 10px; 
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    .weather-search-input { 
      flex: 1; 
      min-width: 0; 
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      font-size: 12px;
      outline: none;
    }
    .weather-search-input:focus {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.08);
    }
    .weather-search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    .weather-btn { 
      white-space: nowrap; 
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .weather-btn:hover { 
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-color);
    }
    .weather-refresh-btn { 
      background: rgba(0, 255, 136, 0.12); 
      border-color: rgba(0, 255, 136, 0.35); 
    }
    .weather-refresh-btn:hover { 
      background: rgba(0, 255, 136, 0.22); 
    }
    .weather-meta { 
      display: flex; 
      justify-content: center; 
      gap: 12px; 
      margin-top: 8px; 
      font-size: 10px; 
      opacity: 0.55; 
    }
    .weather-meta-item { 
      display: flex; 
      align-items: center; 
      gap: 3px; 
    }
  </style>
</head>
<body>
  <div class="weather-container">
    <div id="weatherContent" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      <div class="weather-loading" id="wLoading">
        <div class="weather-spinner"></div>
        <div style="font-size: 12px; opacity: 0.6;">Loading weather...</div>
      </div>
      <div id="weatherApp" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">
        <div class="weather-main">
          <div class="weather-temp" id="wTemp">--°</div>
          <div class="weather-desc" id="wDesc">Loading...</div>
          <div class="weather-location" id="wLocation">Detecting...</div>
          <div class="weather-meta" id="wMeta"></div>
        </div>
        <div class="weather-forecast" id="wForecast"></div>
      </div>
      <div class="weather-error" id="wError" style="display: none;"></div>
    </div>
    <div class="weather-controls">
      <input type="text" class="weather-search-input" id="wCity" placeholder="Search city..." autocomplete="off">
      <button class="weather-btn" onclick="searchWeather()" title="Search">🔍</button>
      <button class="weather-btn weather-refresh-btn" onclick="refreshWeather()" title="Refresh">↻</button>
    </div>
  </div>
  <script>
    // Open-Meteo API (free, no key required)
    const GEOCODING_URL = 'https://geocoding-api.open-meteo.com/v1/search';
    const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast';
    
    let currentLat = null;
    let currentLon = null;
    let currentCity = 'San Francisco';

    const weatherCodes = {
      0: { desc: 'Clear Sky', icon: '☀️' },
      1: { desc: 'Mostly Clear', icon: '🌤️' },
      2: { desc: 'Partly Cloudy', icon: '⛅' },
      3: { desc: 'Overcast', icon: '☁️' },
      45: { desc: 'Foggy', icon: '🌫️' },
      48: { desc: 'Depositing Rime Fog', icon: '🌫️' },
      51: { desc: 'Light Drizzle', icon: '🌦️' },
      53: { desc: 'Moderate Drizzle', icon: '🌦️' },
      55: { desc: 'Dense Drizzle', icon: '🌧️' },
      61: { desc: 'Slight Rain', icon: '🌦️' },
      63: { desc: 'Moderate Rain', icon: '🌧️' },
      65: { desc: 'Heavy Rain', icon: '🌧️' },
      71: { desc: 'Slight Snow', icon: '🌨️' },
      73: { desc: 'Moderate Snow', icon: '🌨️' },
      75: { desc: 'Heavy Snow', icon: '❄️' },
      77: { desc: 'Snow Grains', icon: '❄️' },
      80: { desc: 'Slight Showers', icon: '🌦️' },
      81: { desc: 'Moderate Showers', icon: '🌧️' },
      82: { desc: 'Violent Showers', icon: '⛈️' },
      95: { desc: 'Thunderstorm', icon: '⛈️' },
      96: { desc: 'Thunderstorm & Hail', icon: '⛈️' },
      99: { desc: 'Thunderstorm & Heavy Hail', icon: '⛈️' }
    };

    function getWeatherIcon(code) {
      return weatherCodes[code] || { desc: 'Unknown', icon: '🌡️' };
    }

    async function fetchWeather(lat, lon, cityName) {
      try {
        document.getElementById('wLoading').style.display = 'block';
        document.getElementById('weatherApp').style.display = 'none';
        document.getElementById('wError').style.display = 'none';

        const params = new URLSearchParams({
          latitude: lat,
          longitude: lon,
          current_weather: true,
          daily: 'temperature_2m_max,temperature_2m_min,weather_code',
          timezone: 'auto',
          forecast_days: 5
        });

        const response = await fetch(`${WEATHER_URL}?${params}`);
        if (!response.ok) throw new Error('Failed to fetch weather data');
        
        const data = await response.json();
        const current = data.current_weather;
        const daily = data.daily;

        // Update current weather
        const weatherInfo = getWeatherIcon(current.weathercode);
        document.getElementById('wTemp').textContent = `${Math.round(current.temperature)}°`;
        document.getElementById('wDesc').textContent = weatherInfo.desc;
        document.getElementById('wLocation').textContent = cityName;
        document.getElementById('wDesc').innerHTML = `${weatherInfo.icon} ${weatherInfo.desc}`;

        // Add meta info
        const metaHtml = `
          <div class="weather-meta-item">💨 ${Math.round(current.windspeed)} km/h</div>
          <div class="weather-meta-item">🧭 ${getWindDirection(current.winddirection)}</div>
        `;
        document.getElementById('wMeta').innerHTML = metaHtml;

        // Render forecast
        renderForecast(daily);

        document.getElementById('wLoading').style.display = 'none';
        document.getElementById('weatherApp').style.display = 'flex';
      } catch (error) {
        console.error('Weather fetch error:', error);
        document.getElementById('wLoading').style.display = 'none';
        document.getElementById('wError').style.display = 'block';
        document.getElementById('wError').textContent = 'Unable to fetch weather. Please try again.';
      }
    }

    function getWindDirection(degrees) {
      const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return directions[Math.round(degrees / 45) % 8];
    }

    function renderForecast(daily) {
      const container = document.getElementById('wForecast');
      container.innerHTML = '';
      
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      for (let i = 0; i < Math.min(5, daily.time.length); i++) {
        const date = new Date(daily.time[i]);
        const dayName = i === 0 ? 'Today' : dayNames[date.getDay()];
        const maxTemp = Math.round(daily.temperature_2m_max[i]);
        const minTemp = Math.round(daily.temperature_2m_min[i]);
        const weatherInfo = getWeatherIcon(daily.weather_code[i]);

        const dayEl = document.createElement('div');
        dayEl.className = 'weather-day';
        dayEl.innerHTML = `
          <div class="weather-day-name">${dayName}</div>
          <div class="weather-day-icon">${weatherInfo.icon}</div>
          <div class="weather-day-temp">${maxTemp}°<span style="font-size: 11px; opacity: 0.5; font-weight: 400;">/${minTemp}°</span></div>
        `;
        container.appendChild(dayEl);
      }
    }

    async function searchWeather() {
      const cityInput = document.getElementById('wCity');
      const city = cityInput.value.trim();
      if (!city) return;

      try {
        document.getElementById('wLoading').style.display = 'flex';
        document.getElementById('weatherApp').style.display = 'none';
        document.getElementById('wError').style.display = 'none';

        // Search for the city with more detailed parameters
        const geoResponse = await fetch(`${GEOCODING_URL}?name=${encodeURIComponent(city)}&count=5&language=en&format=json`);
        
        if (!geoResponse.ok) {
          throw new Error('City not found');
        }

        const geoData = await geoResponse.json();
        if (!geoData.results || geoData.results.length === 0) {
          throw new Error('City not found');
        }

        // Get the best match (first result)
        const result = geoData.results[0];
        currentLat = result.latitude;
        currentLon = result.longitude;
        // Include country code for better identification
        const country = result.country ? ` ${result.country}` : '';
        currentCity = `${result.name}${result.admin1 ? ', ' + result.admin1 : ''}${country}`;

        // Fetch weather data for the found location
        await fetchWeather(currentLat, currentLon, currentCity);
        cityInput.value = '';
      } catch (error) {
        console.error('Search error:', error);
        document.getElementById('wLoading').style.display = 'none';
        document.getElementById('wError').style.display = 'block';
        document.getElementById('wError').textContent = `City "${city}" not found. Please check spelling or try a larger city.`;
      }
    }

    function refreshWeather() {
      if (currentLat && currentLon) {
        fetchWeather(currentLat, currentLon, currentCity);
      } else {
        // Default to San Francisco
        currentLat = 37.7749;
        currentLon = -122.4194;
        currentCity = 'San Francisco, CA';
        fetchWeather(currentLat, currentLon, currentCity);
      }
    }

    // Initialize with default location (San Francisco)
    async function initWeather() {
      // Try to get user's location first
      if ('geolocation' in navigator) {
        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
          });
          currentLat = position.coords.latitude;
          currentLon = position.coords.longitude;
          currentCity = 'Your Location';
          
          // Reverse geocode to get city name
          try {
            const reverseResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${currentLat}&longitude=${currentLon}`);
            const reverseData = await reverseResponse.json();
            if (reverseData.results && reverseData.results.length > 0) {
              const r = reverseData.results[0];
              currentCity = `${r.name}${r.admin1 ? ', ' + r.admin1 : ''}`;
            }
          } catch (e) {
            // Use coordinates if reverse geocode fails
            currentCity = `Lat: ${currentLat.toFixed(2)}, Lon: ${currentLon.toFixed(2)}`;
          }
        } catch (geoError) {
          console.log('Geolocation not available, using default');
          currentLat = 37.7749;
          currentLon = -122.4194;
          currentCity = 'San Francisco, CA';
        }
      } else {
        currentLat = 37.7749;
        currentLon = -122.4194;
        currentCity = 'San Francisco, CA';
      }

      await fetchWeather(currentLat, currentLon, currentCity);
    }

    // Handle Enter key in search input
    document.getElementById('wCity').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        searchWeather();
      }
    });

    // Initialize on load
    initWeather();
  </script>
</body>
</html>
